services:
  traefik:
    image: traefik:v3.2
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8080"
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: formance
      POSTGRES_PASSWORD: formance_password
      POSTGRES_DB: formance
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formance -d formance"]
      interval: 5s
      timeout: 5s
      retries: 5

  ledger:
    image: ghcr.io/formancehq/ledger:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_URI: postgresql://formance:formance_password@postgres:5432/formance?sslmode=disable
      BIND: 0.0.0.0:3068
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ledger.rule=PathPrefix(`/api/ledger`)"
      - "traefik.http.routers.ledger.entrypoints=web"
      - "traefik.http.middlewares.ledger-stripprefix.stripprefix.prefixes=/api/ledger"
      - "traefik.http.routers.ledger.middlewares=ledger-stripprefix"
      - "traefik.http.services.ledger.loadbalancer.server.port=3068"

  ts-app:
    build: ./app
    depends_on:
      - traefik
      - ledger
    ports:
      - "3000:3000"
    environment:
      # Point the Formance SDK to the Traefik gateway
      FORMANCE_SERVER_URL: http://traefik:8080
    volumes:
      - ./app/src:/usr/src/app/src

volumes:
  pg_data:
